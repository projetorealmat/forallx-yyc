name: "Publicar HTML traduzido — forall x: Calgary"

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar HTML com BookML
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Compilar HTML com BookML
        id: bookml
        continue-on-error: true
        uses: vlmantova/bookml-action@v1
        with:
          release: false
          upload-aux-directory: false
          version: v0.31.9
          replace-bookml: true
          scheme: full
          timeout-minutes: 8

      - name: Diagnosticar falhas das imagens TikZ
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          found=0
          while IFS= read -r log; do
            found=1
            echo "=== Diagnóstico de imagem: ${log} ==="
            grep -n -E '^!|Error|Emergency stop|Fatal|Runaway|Undefined control sequence|Output written' "${log}" || true
          done < <(find . -type f -name '*.bmllog' -path '*/bmlimages/dvi/*' -print)
          if test "${found}" = 0; then
            echo "Nenhum log .bmllog encontrado."
          fi

      - name: Diagnosticar falha do BookML
        if: ${{ steps.bookml.outcome != 'success' }}
        shell: bash
        run: |
          set -u
          log="${RUNNER_TEMP}/auxdir/latexmlaux/forallxyyc-html.latexmlpost.log"
          if test -f "${log}"; then
            echo "=== Diagnóstico do latexmlpost ==="
            grep -n -E -C 3 'Error:|malformed|RelaxNG|failed to load|No graphic source' "${log}" || true
          else
            echo "Log do latexmlpost não encontrado: ${log}"
          fi

      - name: Interromper se o BookML falhou
        if: ${{ steps.bookml.outcome != 'success' }}
        shell: bash
        run: exit 1

      - name: Validar saída HTML
        shell: bash
        run: |
          set -euo pipefail
          html_dir="${RUNNER_TEMP}/auxdir/html/forallxyyc-html"
          test -s "${html_dir}/index.html"
          test -s "${html_dir}/Chx1.html"

      - name: Preparar conteúdo do Pages
        shell: bash
        run: |
          set -euo pipefail
          html_dir="${RUNNER_TEMP}/auxdir/html/forallxyyc-html"
          mkdir -p _site
          cp -a "${html_dir}/." _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Implantar artefato
        id: deployment
        uses: actions/deploy-pages@v5
