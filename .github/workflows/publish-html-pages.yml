name: "Publicar HTML traduzido — forall x: Calgary"

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-diagnostic
  cancel-in-progress: false

jobs:
  build:
    name: Gerar HTML com BookML
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Compilar HTML com BookML
        uses: vlmantova/bookml-action@v1
        with:
          release: false
          upload-aux-directory: false
          version: v0.31.9
          replace-bookml: true
          scheme: full
          timeout-minutes: 8

      - name: Diagnosticar falha do BookML
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          for log in \
            "${RUNNER_TEMP}/auxdir/latexmlaux/forallxyyc-html.latexml.log" \
            "${RUNNER_TEMP}/auxdir/latexmlaux/forallxyyc-html.latexmlpost.log"; do
            if test -f "$log"; then
              echo "::group::$(basename "$log")"
              grep -Ein "error|fatal|malformed|RelaxNG|invalid|failed|undefined" "$log" | tail -n 120
              echo "::endgroup::"
            fi
          done

      - name: Validar saída HTML
        shell: bash
        run: |
          set -euo pipefail
          html_dir="${RUNNER_TEMP}/auxdir/html/forallxyyc-html"
          test -s "${html_dir}/index.html"
          test -s "${html_dir}/Chx1.html"

      - name: Preparar conteúdo do Pages
        shell: bash
        run: |
          set -euo pipefail
          html_dir="${RUNNER_TEMP}/auxdir/html/forallxyyc-html"
          mkdir -p _site
          cp -a "${html_dir}/." _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Implantar artefato
        id: deployment
        uses: actions/deploy-pages@v5
